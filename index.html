<head>

<title>GJail</title>
<style>
:root{color-scheme:dark;--tx:#f4f6fa;--mut:rgba(255,255,255,.62);--acc:#9a9aa8;--acc2:#5b8cff;--ok:#32d74b;--gl:rgba(255,255,255,.075);--gb:rgba(255,255,255,.09);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;-webkit-text-size-adjust:100%;touch-action:manipulation;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;background:#05070b;color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif}
body{min-height:100vh;min-height:100dvh;display:flex;justify-content:center}
.app{width:100%;max-width:430px;min-height:100vh;min-height:100dvh;position:relative;display:flex;flex-direction:column;padding:16px max(22px,env(safe-area-inset-right,0px)) 18px max(22px,env(safe-area-inset-left,0px));overflow:hidden;background:linear-gradient(170deg,#0d1624 0%,#0a0f18 55%,#10141c 100%)}
.bg{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:fl 14s ease-in-out infinite alternate}
.bg i:nth-child(1){width:340px;height:340px;background:#3d5fa8;left:-120px;top:-60px}
.bg i:nth-child(2){width:300px;height:300px;background:#7b7f8c;right:-130px;top:38%;animation-delay:-6s}
.bg i:nth-child(3){width:260px;height:260px;background:#2a3f6e;left:10%;bottom:-100px;animation-delay:-3s}
@keyframes fl{to{transform:translate(40px,50px) scale(1.12)}}
.ghost{position:absolute;top:8px;right:8px;width:48px;height:48px;border:0;background:transparent;opacity:.04;color:#fff;z-index:3;cursor:pointer}
header,main,footer{position:relative;z-index:2}
h1{margin:6px 0 8px;font-size:36px;font-weight:700;letter-spacing:-.8px}
.sub{font-size:12px;line-height:1.5;color:var(--mut);white-space:pre-line}
main{flex:1;display:flex;align-items:flex-end;padding-bottom:18px}
.glass{background:var(--gl);border:1px solid var(--gb);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-radius:20px;color:var(--tx)}
.menu{width:100%;padding:4px 18px}
.mrow{display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid rgba(255,255,255,.1);font-size:15px;cursor:pointer}
.mrow:last-child{border:0}
.mrow .ic{width:22px;display:grid;place-items:center;opacity:.9}
svg.s{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.upd svg.s,.obtn svg.s{width:15px;height:15px;margin-right:4px;vertical-align:-3px}
.opt i svg.s{width:24px;height:24px}
.mrow .tx{flex:1}
.mrow .vl{color:var(--mut);font-size:13px}
.mrow .ch{color:var(--mut)}
.mrow.off{opacity:.38;pointer-events:none}
.logp{width:100%;height:min(300px,42dvh);padding:14px;display:flex;flex-direction:column;gap:10px}
.pb{height:3px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}
.pb b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .4s}
.log{flex:1;overflow:auto;font:11.5px/1.6 ui-monospace,Menlo,Consolas,monospace;color:rgba(255,255,255,.75)}
.log .ok{color:var(--ok)}.log .hl{color:#b4c6ff}
.big{width:100%;padding:17px;font-size:16px;font-weight:600;cursor:pointer;text-align:center}
.big:disabled{opacity:.75;cursor:default}
.big.done{color:var(--acc)}
.upd{display:block;margin:14px auto 0;border:0;background:none;color:var(--mut);font-size:14px;cursor:pointer}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:6}
.sheet.show{display:flex}
.panel{width:100%;max-width:430px;background:#10141c;border-radius:24px 24px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));max-height:88vh;max-height:88dvh;overflow:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.panel h2{margin:0 0 4px;font-size:22px}
.panel p{color:var(--mut);font-size:14px;margin:0 0 14px}
.lbl{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.8px;margin:18px 4px 8px}
.card{background:var(--gl);border-radius:16px;padding:2px 16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:15px}
.row:last-child{border:0}
.tog{position:relative;width:50px;height:30px;background:#3a3f4a;border-radius:20px;cursor:pointer;flex:none;transition:.2s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.tog.on{background:var(--acc2)}.tog.on::after{left:23px}
.opt{display:flex;gap:12px;align-items:center;background:var(--gl);border-radius:16px;padding:14px;margin-bottom:10px;cursor:pointer;border:2px solid transparent}
.opt.on{border-color:var(--acc2)}
.opt i{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-style:normal;font-size:22px;flex:none;background:rgba(255,255,255,.08)}
.opt b{display:block;font-size:16px}.opt small{color:var(--mut)}
.seg{display:flex;background:var(--gl);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;color:var(--mut);padding:10px 4px;border-radius:11px;font-size:14px;font-weight:600;cursor:pointer}
.seg button.on{background:rgba(255,255,255,.12);color:var(--tx)}
.btn2{width:100%;border:0;padding:15px;border-radius:14px;background:var(--acc2);color:#fff;font-size:16px;font-weight:700;margin-top:14px;cursor:pointer}
select{width:100%;background:var(--gl);color:var(--tx);border:1px solid var(--gb);border-radius:12px;padding:13px;font-size:16px}
select option{background:#10141c}
.ov{position:fixed;inset:0;z-index:7;background:rgba(6,9,14,.82);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);display:none;flex-direction:column;align-items:center;justify-content:center;padding:40px 28px;text-align:center}
.ov.show{display:flex}
.ov h3{margin:0 0 14px;font-size:17px;font-weight:600}
.chg{max-width:380px;max-height:55vh;overflow:auto;font-size:13px;line-height:1.55;color:var(--mut);text-align:left;white-space:pre-line}
.obtn{margin-top:20px;border:1px solid var(--gb);background:var(--gl);color:var(--tx);padding:11px 26px;border-radius:12px;font-size:15px;cursor:pointer}
.obtn.t{border:0;background:none;color:var(--mut);margin-top:10px}
.ring{position:relative;width:128px;height:128px;margin:22px 0}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;font-weight:500}
.sp{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.18);border-top-color:#fff;animation:rot .9s linear infinite;margin-top:18px}
@keyframes rot{to{transform:rotate(360deg)}}
#ov3{background:#000;backdrop-filter:none}
.lg{width:84px;height:84px;border-radius:22px;background:linear-gradient(145deg,var(--acc),var(--acc2));display:grid;place-items:center;font-size:34px;font-weight:800;letter-spacing:-1px}
.opt i{overflow:hidden}.opt i:has(img){background:none}.opt i img{width:100%;height:100%;object-fit:cover;display:block;border-radius:11px}
#sileo{position:fixed;inset:0;z-index:8;background:#0a0d13;display:none;flex-direction:column;align-items:center}
#sileo.show{display:flex}
.sh{width:100%;max-width:430px;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 0}
.sx{width:44px;height:44px;border-radius:50%;border:0;background:var(--gl);color:var(--tx);display:grid;place-items:center;cursor:pointer}
.sb{flex:1;overflow:auto;padding:4px 20px 20px;max-width:430px;width:100%}
.st{font-size:32px;font-weight:700;margin:6px 0 14px}
.sh2{font-size:19px;font-weight:700;margin:22px 0 6px}
.ban{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory}
.ban div{flex:none;width:82%;height:150px;border-radius:18px;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;scroll-snap-align:start;font-weight:700;font-size:20px}
.ban small{font-weight:400;font-size:13px;opacity:.85}
.pr{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.07);cursor:pointer}
.pi{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:20px;flex:none;overflow:hidden}
.pi img{width:100%;height:100%;display:block}
.pt{flex:1;min-width:0}.pt b{display:block;font-size:15px}.pt small{color:var(--mut);font-size:12px}
.gt{border:0;border-radius:14px;padding:9px 16px;background:rgba(91,140,255,.18);color:var(--acc2);font-weight:700;font-size:12px;cursor:pointer}
.gt.ins{background:rgba(255,255,255,.1);color:var(--mut)}
.tb{display:flex;justify-content:space-around;width:100%;max-width:430px;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid rgba(255,255,255,.08);background:#0a0d13}
.tb button{background:none;border:0;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;cursor:pointer;padding:4px 12px}
.tb button.on{color:var(--acc2)}
.tb svg.s{width:22px;height:22px}
.si{width:100%;background:var(--gl);border:1px solid var(--gb);border-radius:12px;padding:12px 14px;color:var(--tx);font-size:16px;margin-bottom:6px}
#detSheet{z-index:9}
.row.off{opacity:.38;pointer-events:none}.row.lk{cursor:pointer}
.si,select,input{-webkit-user-select:text;user-select:text;-webkit-appearance:none;appearance:none}
select{background-image:none}
.sb,.panel,.log,.chg,.ban{-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.mrow,.opt,.pr,.big,.btn2,.obtn,.upd,.row.lk,.tb button,.seg button{transition:opacity .12s,transform .12s}
.mrow:active,.opt:active,.pr:active,.row.lk:active,.upd:active{opacity:.6}
.big:active,.btn2:active,.obtn:active{transform:scale(.98);opacity:.85}
.tb button{min-width:64px;min-height:48px;justify-content:center}
.seg button{min-height:44px}
@media (max-height:700px){h1{font-size:30px}.mrow{padding:13px 0}.logp{height:36dvh}.big{padding:15px}}

</style>
</head>

    d.onclick=function(){onpick(p.id)};el.appendChild(d);
  });
}
function renderLists(){
  var pick=function(id){pm=id;renderLists()};
  opts("#pmListS",pms,pm,pick,true);opts("#pmListP",pms,pm,pick,true);
  opts("#expList",exps.map(function(e){return{id:e,ic:"<svg class='s' viewBox='0 0 24 24'><polygon points='13 2 3 14 12 14 11 22 21 10 12 10 13 2'/></svg>",d:"GJail exploit"}}),exp,function(id){if(!busy){exp=id;renderLists();info()}},false);
}
function fillSel(){
  $("#selDev").innerHTML=devs.map(function(d,i){return '<option value="'+i+'">'+d[0]+' ('+d[1]+')</option>'}).join("");
  $("#selIos").innerHTML=ioss.map(function(d,i){return '<option value="'+i+'">iOS '+d[0]+' ('+d[1]+')</option>'}).join("");
  $("#selDev").value=dev;$("#selIos").value=ios;
}
function info(){
  $("#sub").textContent="iOS 16.5 - 27.1 | A12 - A19, M1\n"+devs[dev][0]+" | iOS "+ioss[ios][0]+" ("+ioss[ios][1]+")\nVersion "+ver+" | rootless\nby vitya, claude";
  $("#expVal").textContent=exp;
}
function apply(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(function(e){e.textContent=t(e.dataset.t)});
  document.querySelectorAll("#langSeg button").forEach(function(b){b.classList.toggle("on",b.dataset.l===lang)});
  $("#goTxt").textContent=busy?t("going"):done?"✓ "+t("jb"):t("go");
  $("#upd").hidden=!hasUpd;
  info();renderLists();
}
document.querySelectorAll("#langSeg button").forEach(function(b){b.onclick=function(){lang=b.dataset.l;apply()}});
document.querySelectorAll(".tog").forEach(function(x){x.onclick=function(){x.classList.toggle("on")}});
function show(id){$(id).classList.add("show")}
function hide(id){$(id).classList.remove("show")}
$("#mSet").onclick=function(){show("#setSheet")};
$("#mExp").onclick=function(){if(!busy)show("#expSheet")};
$("#mCr").onclick=function(){show("#crSheet")};
$("#openSpoof").onclick=function(){if(busy)return;fillSel();show("#spoofSheet")};
$("#spoofOk").onclick=function(){dev=+$("#selDev").value;ios=+$("#selIos").value;hide("#spoofSheet");info()};
document.querySelectorAll("[data-close]").forEach(function(b){b.onclick=function(){b.closest(".sheet").classList.remove("show")}});
document.querySelectorAll(".sheet").forEach(function(s){s.onclick=function(e){if(e.target===s&&s.id!=="pmSheet")s.classList.remove("show")}});

function wait(ms){return new Promise(function(r){setTimeout(r,ms)})}
function hex(n){var s="";for(var i=0;i<n;i++)s+=Math.floor(Math.random()*16).toString(16);return s}
function log(m,c){var l=$("#log"),d=document.createElement("div");if(c)d.className=c;d.textContent=m;l.appendChild(d);l.scrollTop=l.scrollHeight}
function prog(p){$("#bar").style.width=p+"%"}
function askPM(){return new Promise(function(res){show("#pmSheet");$("#pmOk").onclick=function(){hide("#pmSheet");res()}})}

async function run(){
  if(busy||done)return;busy=true;
  $("#go").disabled=true;$("#goTxt").textContent=t("going");
  $("#menu").hidden=true;$("#logp").hidden=false;$("#log").innerHTML="";prog(0);
  var s=[[t("l_start"),"hl",300,4],[t("l_dev")+devs[dev][1]+", iOS "+ioss[ios][0],"",300,8],[t("l_sel")+exp,"hl",400,12],[t("l_run")+exp+"…","",900,20],[t("l_heap")+hex(8),"",800,28],[t("l_kprim"),"ok",900,38],[t("l_kbase")+"0xfffffff0"+hex(8),"",500,44],[t("l_pac"),"",800,52],[t("l_pacok"),"ok",500,56],[t("l_ppl"),"",900,62],[t("l_pplok"),"ok",500,66],[t("l_sbx"),"",800,72],[t("l_tc"),"",700,78],[t("l_root"),"ok",500,82]];
  for(var i=0;i<s.length;i++){log(s[i][0],s[i][1]);prog(s[i][3]);await wait(s[i][2])}
  log(t("l_wait"),"hl");await askPM();
  var s2=[[t("l_boot"),"",900,88],[t("l_inst")+pm+".app…","",1000,92],[t("l_ld"),"",900,95],[t("l_inj"),"",800,98],[t("l_reb"),"",1400,100]];
  for(i=0;i<s2.length;i++){log(s2[i][0]);prog(s2[i][3]);await wait(s2[i][2])}
  log(t("l_pmok")+pm,"ok");log(t("l_ok"),"ok");
  await wait(1400);
  busy=false;done=true;
  $("#logp").hidden=true;$("#menu").hidden=false;
  $("#mSB").classList.remove("off");$("#mRU").classList.remove("off");
  $("#go").classList.add("done");apply();
}
$("#go").onclick=run;

async function overlay(key,ms){$("#ov3T").textContent=t(key);show("#ov3");await wait(ms);hide("#ov3")}
$("#mSB").onclick=function(){overlay("respring",2200)};
$("#mRU").onclick=function(){overlay("rebooting",3600)};

$("#upd").onclick=function(){show("#ov1")};
$("#cancelUpd").onclick=function(){hide("#ov1")};
$("#doUpd").onclick=async function(){
  hide("#ov1");show("#ov2");$("#dlT").textContent=t("downloading");
  var p=0;
  while(p<100){p=Math.min(100,p+Math.floor(Math.random()*9)+2);
    $("#pct").textContent=p+"%";$("#ringC").style.strokeDashoffset=326.7*(1-p/100);await wait(160)}
  $("#dlT").textContent=t("installed");await wait(1100);
  hide("#ov2");hasUpd=false;ver="2.0.2";apply();
  $("#pct").textContent="0%";$("#ringC").style.strokeDashoffset=326.7;
};
var PK=[["Sileo","Sileo Team","2.5","Modern package manager for iOS jailbreaks.","System","#4a7bd8"],["Zebra","Wilson Styres","1.1.30","A useful, feature-rich package manager.","System","#c9ccd6"],["ElleKit","evelyne","1.1.3","Tweak injection library for rootless jailbreaks.","Development","#6b7a99"],["PreferenceLoader","Dustin Howett","3.0","Loads tweak preference bundles into Settings.","Tweaks","#5a6e8f"],["Cephei","HASHBANG Productions","2.1","Helper library for tweak preferences.","Development","#7d8597"],["Choicy","opa334","1.5.1","Disable tweaks per app and per process.","Tweaks","#3f6fb5"],["Cylinder Reborn","ryannair05","1.2","Page transition animations for the Home Screen.","Tweaks","#8b93a7"],["AppList","Ryan Petrich","1.0","Utility library for listing installed apps.","Development","#566785"]];
var SR=[["Procursus","apt.procurs.us","#5b8cff"],["Chariz","repo.chariz.com","#7d8597"],["Havoc","havoc.app","#4a6fb0"],["BigBoss","apt.thebigboss.org","#8b93a7"]];
var inst={ElleKit:1,PreferenceLoader:1,Cephei:1},tab="home",cur=0;
function pic(p){var m=pms.filter(function(x){return x.id===p[0]})[0];return '<div class="pi" style="background:'+(m?'none':p[5])+'">'+(m?m.ic:p[0].charAt(0))+'</div>'}
function row(i){var p=PK[i],on=inst[p[0]];return '<div class="pr" data-i="'+i+'">'+pic(p)+'<div class="pt"><b>'+p[0]+'</b><small>'+p[1]+' · '+p[2]+'</small></div><button class="gt'+(on?' ins':'')+'">'+(on?t("inst"):t("get"))+'</button></div>'}
function rows(a){return a.map(row).join("")}
function all(){return PK.map(function(p,i){return i})}
function bind(){document.querySelectorAll("#sb .pr[data-i]").forEach(function(r){r.onclick=function(){detail(+r.dataset.i)}})}
function render(){
  inst[pm]=1;var h="";
  if(tab==="home"){
    h='<div class="st">'+t("tabHome")+'</div><div class="ban"><div style="background:linear-gradient(135deg,#3d5fa8,#7b7f8c)">'+t("welcome")+' '+pm+'<small>'+t("welcomeSub")+'</small></div><div style="background:linear-gradient(135deg,#566785,#2a3f6e)">'+t("ban2")+'<small>'+t("ban2Sub")+'</small></div></div><div class="sh2">'+t("newPk")+'</div>'+rows([2,3,4,5,6,7]);
  }else if(tab==="src"){
    h='<div class="st">'+t("tabSrc")+'</div>'+SR.map(function(s){return '<div class="pr"><div class="pi" style="background:'+s[2]+'">'+s[0].charAt(0)+'</div><div class="pt"><b>'+s[0]+'</b><small>'+s[1]+'</small></div></div>'}).join("");
  }else if(tab==="pkg"){
    h='<div class="st">'+t("instT")+'</div>'+rows(all().filter(function(i){return inst[PK[i][0]]}));
  }else{
    h='<div class="st">'+t("tabSearch")+'</div><input class="si" id="si" placeholder="'+t("searchPh")+'"><div id="sres">'+rows(all())+'</div>';
  }
  $("#sb").innerHTML=h;bind();
  var si=$("#si");
  if(si)si.oninput=function(){var q=si.value.toLowerCase();$("#sres").innerHTML=rows(all().filter(function(i){return (PK[i][0]+PK[i][1]+PK[i][3]).toLowerCase().indexOf(q)>-1}));bind()};
  document.querySelectorAll(".tb button").forEach(function(b){b.classList.toggle("on",b.dataset.tab===tab)});
}
function dBtn(){var b=$("#dGet"),on=inst[PK[cur][0]];b.disabled=false;b.className="gt"+(on?" ins":"");b.textContent=on?t("inst"):t("get")}
function detail(i){
  cur=i;var p=PK[i];
  $("#detBody").innerHTML='<div style="display:flex;gap:14px;align-items:center;margin-bottom:12px">'+pic(p)+'<div style="flex:1"><h2 style="margin:0;font-size:20px">'+p[0]+'</h2><div style="color:var(--mut);font-size:13px">'+p[1]+' · '+p[2]+' · '+p[4]+'</div></div><button class="gt" id="dGet"></button></div><p style="margin:0">'+p[3]+'</p>';
  dBtn();show("#detSheet");
  $("#dGet").onclick=function(){var n=PK[cur][0];if(inst[n])return;var b=$("#dGet");b.textContent=t("installing");b.disabled=true;setTimeout(function(){inst[n]=1;dBtn();render()},1700)};
}
document.querySelectorAll(".tb button").forEach(function(b){b.onclick=function(){tab=b.dataset.tab;render()}});
$("#mPM").onclick=function(){hide("#setSheet");render();show("#sileo")};
$("#sClose").onclick=function(){hide("#sileo")};
var _ap=apply;
apply=function(){_ap();$("#pmRowTx").textContent=t("open")+" "+pm;$("#mPM").classList.toggle("off",!done);if($("#sileo").classList.contains("show"))render()};
apply();
</script>
</body>
