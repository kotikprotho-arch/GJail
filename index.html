<!DOCTYPE html>
<html lang="en" data-theme="black">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nexora">
<meta name="theme-color" content="#0b0b0e">
<meta name="format-detection" content="telephone=no">
<title>Nexora</title>
<style>
:root{color-scheme:dark;--acc:#9a9aa8;--acc2:#5b8cff;--ok:#32d74b;--w:255,255,255;--tx:#f4f6fa;--mut:rgba(var(--w),.58);--gl:rgba(var(--w),.075);--gb:rgba(var(--w),.09);--ln:rgba(var(--w),.1);--bg1:#0b0b0e;--bg2:#060608;--bg3:#0a0a0d;--pn:#121216;--ease:cubic-bezier(.22,.8,.26,1)}
:root[data-theme=light]{color-scheme:light;--w:0,0,0;--tx:#111318;--bg1:#f5f7fb;--bg2:#eef1f7;--bg3:#e8ecf4;--pn:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{height:100%;overflow:hidden;background:var(--bg3);-webkit-text-size-adjust:100%}
body{margin:0;position:fixed;inset:0;overflow:hidden;color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;touch-action:manipulation;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
body::before,body::after{content:"";position:fixed;left:0;right:0;z-index:-1}
body::before{top:0;height:env(safe-area-inset-top,0px);background:var(--bg1)}
body::after{bottom:0;height:env(safe-area-inset-bottom,0px);background:var(--bg3)}
.app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(170deg,var(--bg1),var(--bg2) 55%,var(--bg3));padding:calc(14px + env(safe-area-inset-top,0px)) max(22px,env(safe-area-inset-right,0px),calc((100% - 430px)/2)) calc(16px + env(safe-area-inset-bottom,0px)) max(22px,env(safe-area-inset-left,0px),calc((100% - 430px)/2))}
.bg{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;animation:fl 14s ease-in-out infinite alternate}
.bg i:nth-child(1){width:340px;height:340px;background:var(--acc2);left:-120px;top:-60px}
.bg i:nth-child(2){width:300px;height:300px;background:var(--acc);right:-130px;top:38%;animation-delay:-6s}
.bg i:nth-child(3){width:260px;height:260px;background:color-mix(in srgb,var(--acc2) 55%,#000);left:10%;bottom:-100px;animation-delay:-3s}
:root[data-theme=light] .bg i{opacity:.28}
@keyframes fl{to{transform:translate(40px,50px) scale(1.12)}}
.ghost{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:8px;width:48px;height:48px;border:0;background:transparent;opacity:.04;color:#fff;z-index:3;cursor:pointer}
header,main,footer{position:relative;z-index:2}
header{animation:rise .6s var(--ease) both}
h1{margin:6px 0 8px;font-size:38px;font-weight:700;letter-spacing:-1px;background:linear-gradient(90deg,var(--tx) 0%,var(--acc2) 50%,var(--tx) 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:-200% 0}}
.sub{font-size:12px;line-height:1.5;color:var(--mut);white-space:pre-line}
main{flex:1;min-height:0;display:flex;align-items:flex-end;padding-bottom:18px}
.glass{background:var(--gl);border:1px solid var(--gb);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);border-radius:20px;color:var(--tx)}
.menu{width:100%;padding:4px 18px}
.mrow{display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--ln);font-size:15px;cursor:pointer;animation:rise .55s var(--ease) both}
.mrow:nth-child(1){animation-delay:.08s}.mrow:nth-child(2){animation-delay:.14s}.mrow:nth-child(3){animation-delay:.2s}.mrow:nth-child(4){animation-delay:.26s}.mrow:nth-child(5){animation-delay:.32s}
.mrow:last-child{border:0}
.mrow .ic{width:22px;display:grid;place-items:center;opacity:.9}
.mrow .tx{flex:1}.mrow .vl{color:var(--mut);font-size:13px}.mrow .ch{color:var(--mut)}
.mrow.off{opacity:.38;pointer-events:none}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
svg.s{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.logp{width:100%;height:min(300px,42dvh);padding:14px;display:flex;flex-direction:column;gap:10px;animation:rise .5s var(--ease) both}
.pb{height:3px;background:rgba(var(--w),.12);border-radius:3px;overflow:hidden}
.pb b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .45s var(--ease)}
.log{flex:1;overflow:auto;font:11.5px/1.6 ui-monospace,Menlo,Consolas,monospace;color:rgba(var(--w),.78)}
.log div{animation:rise .3s ease both}
.log .ok{color:var(--ok)}.log .hl{color:color-mix(in srgb,var(--acc2) 60%,var(--tx))}
:root[data-theme=light] .log .ok{color:#1c9c3a}
.big{width:100%;padding:17px;font-size:16px;font-weight:600;cursor:pointer;text-align:center;transition:transform .15s var(--ease),opacity .2s,color .35s,border-color .35s;animation:rise .6s .4s var(--ease) both}
.big:disabled{opacity:.75;cursor:default}
.big.done{color:var(--acc2);border-color:color-mix(in srgb,var(--acc2) 45%,transparent);opacity:1}
.big.done span{display:inline-block;animation:pop .55s var(--ease)}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12)}100%{transform:none;opacity:1}}
.mrow,.opt,.row.lk,.btn2,.mini,.gt,.seg button,.sw{transition:transform .15s var(--ease),opacity .2s,background .25s,border-color .25s,box-shadow .25s}
.mrow:active,.opt:active,.row.lk:active{transform:scale(.98);opacity:.7}
.big:active:not(:disabled),.btn2:active,.mini:active,.gt:active,.sw:active{transform:scale(.95)}
.sheet{position:fixed;inset:0;z-index:6;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.5);opacity:0;visibility:hidden;transition:opacity .28s var(--ease),visibility 0s .28s}
.sheet.show{opacity:1;visibility:visible;transition:opacity .28s var(--ease)}
.panel{width:100%;max-width:430px;background:var(--pn);border-radius:24px 24px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));max-height:90vh;max-height:90dvh;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;transform:translateY(60px) scale(.98);transition:transform .4s var(--ease)}
.sheet.show .panel{transform:none}
.panel h2{margin:0 0 4px;font-size:22px}
.panel p,.hint{color:var(--mut);font-size:14px;margin:0 0 14px}
.hint{font-size:13px;margin:-2px 4px 10px}
.lbl{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.8px;margin:20px 4px 8px}
.card{background:var(--gl);border-radius:16px;padding:2px 16px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--ln);font-size:15px}
.row:last-child{border:0}
.row.lk{cursor:pointer}
.tog{position:relative;width:50px;height:30px;background:rgba(var(--w),.2);border-radius:20px;cursor:pointer;flex:none;transition:background .25s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .25s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tog.on{background:var(--acc2)}.tog.on::after{left:23px}
.opt{display:flex;gap:12px;align-items:center;background:var(--gl);border-radius:16px;padding:14px;margin-bottom:10px;cursor:pointer;border:2px solid transparent}
.opt.on{border-color:var(--acc2)}
.opt i{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-style:normal;flex:none;overflow:hidden;background:rgba(var(--w),.08)}
.opt i img{width:100%;height:100%;display:block}
.opt i svg{width:24px;height:24px}
.opt div{flex:1;min-width:0}
.opt b{display:block;font-size:16px}
.opt small{display:block;color:var(--mut);font-size:12.5px;line-height:1.4;margin-top:2px}
.opt .sup{color:var(--acc2);font-size:12px;margin-top:5px}
.tag{font-style:normal;font-size:10px;font-weight:600;margin-left:8px;padding:2px 7px;border-radius:8px;background:rgba(var(--w),.1);color:var(--mut);vertical-align:2px}
.opt.dis{opacity:.38;filter:grayscale(1);pointer-events:none}
.opt.dis .sup{color:var(--mut)}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid rgba(var(--w),.25);display:grid;place-items:center;flex:none;color:#fff}
.opt.on .chk{background:var(--acc2);border-color:var(--acc2)}
.chk svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.seg{display:flex;background:var(--gl);border-radius:14px;padding:4px;gap:4px;margin:12px 0 4px}
.seg button{flex:1;min-height:44px;border:0;background:none;color:var(--mut);border-radius:11px;font-size:14px;font-weight:600;cursor:pointer}
.seg button.on{background:rgba(var(--w),.13);color:var(--tx)}
.acr{display:flex;gap:12px;flex-wrap:wrap;padding:6px 4px}
.sw{width:38px;height:38px;border-radius:50%;border:0;cursor:pointer;outline:0}
.sw.on{box-shadow:0 0 0 3px var(--pn),0 0 0 5px currentColor}
.btn2{width:100%;border:0;padding:15px;border-radius:14px;background:var(--acc2);color:#fff;font-size:16px;font-weight:700;margin-top:14px;cursor:pointer}
.mini{border:0;border-radius:10px;padding:9px 14px;background:rgba(var(--w),.12);color:var(--tx);font-size:13px;font-weight:600;cursor:pointer}
.mini.red{color:#ff6b6b}
.gt{border:0;border-radius:14px;padding:9px 16px;background:color-mix(in srgb,var(--acc2) 18%,transparent);color:var(--acc2);font-weight:700;font-size:13px;cursor:pointer}
.gt.ins,.gt:disabled{background:rgba(var(--w),.1);color:var(--mut);cursor:default}
select{width:100%;background:var(--gl);color:var(--tx);border:1px solid var(--gb);border-radius:12px;padding:13px;font-size:16px;-webkit-user-select:text}
select option{background:var(--pn);color:var(--tx)}
.tabc{animation:tabIn .38s var(--ease) both}
@keyframes tabIn{from{opacity:0;transform:translateX(16px)}}
.note{font-size:13px;color:var(--mut);background:var(--gl);border-radius:12px;padding:11px 14px;margin:12px 0}
#tJb.locked .jbf{opacity:.38;pointer-events:none}
.ti{width:46px;height:46px;border-radius:11px;flex:none;object-fit:cover}
.tt{flex:1;min-width:0}.tt b{display:block;font-size:15px}.tt small{color:var(--mut);font-size:12px}
.bprev{width:54px;height:54px;border-radius:12px;background:rgba(var(--w),.1) center/cover no-repeat;flex:none;cursor:pointer;border:1px solid var(--gb)}
.bcol{flex:1}.bcol small{display:block;color:var(--mut);font-size:12px;margin-bottom:8px}
.bbtns{display:flex;gap:8px}
#boot{position:fixed;inset:0;z-index:10;background:#000 center/cover no-repeat;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .5s ease,visibility 0s .5s}
#boot.show{opacity:1;visibility:visible;transition:opacity .5s ease}
#boot.img{align-items:flex-end;padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
.sp{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;animation:rot .9s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@media (max-height:700px){h1{font-size:30px}.mrow{padding:13px 0}.logp{height:36dvh}.big{padding:15px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

</div>

function detect(){

  log(t("l_wait"),"hl");await askPM();
  var names=S.pms.join(", ");
  var s2=[[t("l_boot"),"",900,88],[t("l_inst")+names+"…","",1000,92],[t("l_ld"),"",900,95],[t("l_inj"),"",800,98,1],[t("l_reb"),"",1400,100]];
  for(i=0;i<s2.length;i++){if(!(s2[i][4]&&!S.o.verb))log(s2[i][0]);prog(s2[i][3]);await wait(s2[i][2])}
  log(t("l_pmok")+names,"ok");log(t("l_ok"),"ok");
  await wait(1000);
  ovBusy=true;$("#boot").classList.add("show");await wait(4200);
  busy=false;S.done=1;$("#logp").hidden=true;$("#menu").hidden=false;render();
  $("#boot").classList.remove("show");await wait(520);ovBusy=false;
}

function resetJb(){
  if(busy)return;
  S.done=0;S.ts=0;tsBusy=false;
  S.o.inj=1;S.o.hide=1;S.o.jit=0;S.o.ssh=0;S.o.ota=0;S.o.safe=0;
  render();
}
function fillSel(){
  $("#selDev").innerHTML=devs.map(function(d,i){return '<option value="'+i+'">'+d[0]+' ('+d[1]+')</option>'}).join("");
  $("#selIos").innerHTML=ioss.map(function(d,i){return '<option value="'+i+'">iOS '+d[0]+' ('+d[1]+')</option>'}).join("");
  $("#selDev").value=didx(S.dev);$("#selIos").value=iidx(S.ios);$("#detMsg").textContent=t("detNote");
}

/* ---- events ---- */
$("#mSet").onclick=function(){show("#setSheet")};
$("#mExp").onclick=function(){if(!busy)show("#expSheet")};
$("#mCr").onclick=function(){show("#crSheet")};
$("#mSB").onclick=function(){if(S.done)plain(2400)};
$("#mRU").onclick=function(){if(S.done)plain(3800)};
$("#mIC").onclick=function(){if(S.done)plain(2200)};
$("#openSpoof").onclick=function(){if(busy)return;fillSel();show("#spoofSheet")};
$("#spoofOk").onclick=function(){S.dev=devs[+$("#selDev").value][0];S.ios=ioss[+$("#selIos").value][0];hide("#spoofSheet");render()};
$("#detBtn").onclick=function(){
  var r=detect();
  if(!r){$("#detMsg").textContent=t("detFail");return}
  if(r.dev)$("#selDev").value=didx(r.dev);
  if(r.ios)$("#selIos").value=iidx(r.ios);
  $("#detMsg").textContent=t("detOk");
};
$$("[data-close]").forEach(function(b){b.onclick=function(){b.closest(".sheet").classList.remove("show")}});
$$(".sheet").forEach(function(s){s.onclick=function(e){if(e.target===s&&s.id!=="pmSheet")s.classList.remove("show")}});
$$("#stSeg button").forEach(function(b){b.onclick=function(){
  if(tab===b.dataset.s)return;tab=b.dataset.s;
  var a=$("#tGen"),c=$("#tJb");a.hidden=tab!=="gen";c.hidden=tab!=="jb";
  var n=tab==="gen"?a:c;n.classList.remove("tabc");void n.offsetWidth;n.classList.add("tabc");
  render();
}});
$$(".tog").forEach(function(x){x.onclick=function(){S.o[x.dataset.k]=S.o[x.dataset.k]?0:1;render()}});
$$("#thSeg button").forEach(function(b){b.onclick=function(){S.theme=b.dataset.th;render()}});
$$("#langSeg button").forEach(function(b){b.onclick=function(){S.lang=b.dataset.l;render()}});
$("#mReset").onclick=resetJb;
$("#tsBtn").onclick=function(){if(!S.done||S.ts||tsBusy)return;tsBusy=true;render();setTimeout(function(){tsBusy=false;S.ts=1;render()},2200)};
$("#bootPick").onclick=function(){$("#bootFile").click()};
$("#bootPrev").onclick=function(){plain(2400)};
$("#bootRm").onclick=function(){bootImg="";try{localStorage.removeItem(BK)}catch(e){}applyBoot()};
$("#bootFile").onchange=function(){
  var f=this.files&&this.files[0],inp=this;if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    var im=new Image();
    im.onload=function(){
      var s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement("canvas");
      c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      bootImg=c.toDataURL("image/jpeg",.75);
      try{localStorage.setItem(BK,bootImg)}catch(e){}
      applyBoot();
    };
    im.src=r.result;
  };
  r.readAsDataURL(f);inp.value="";
};
$("#go").onclick=run;

/* ---- init ---- */
load();
if(!saved){var dt=detect();if(dt){if(dt.dev)S.dev=dt.dev;if(dt.ios)S.ios=dt.ios}}
applyBoot();render();
})();
</script>
</body>
</html>
